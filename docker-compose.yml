# The results page, always on: http://127.0.0.1:8765
#   start:  docker compose up -d
#   stop:   docker compose down
# Shows the study runs only (results/part1/runs/bonus, results/part1/runs/message, results/part2/runs); pilot, calibration, test and discarded runs are in results/supplementary/. The repo folder is mounted, so new run folders appear by themselves, refreshed
# every 60 seconds. The page needs only the Python standard library, so a plain Python image is enough.
# The port is published to this machine only (127.0.0.1), never to the network.
services:
  results:
    image: python:3.12-slim
    container_name: shortcut-paradox-results
    restart: unless-stopped
    working_dir: /app
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8765:8765"
    command: >
      python -m shortcut_paradox view --host 0.0.0.0 --port 8765 --no-browser --every 60 --out results/supplementary/viewer_cache
      --runs-dir results/part1/runs/bonus results/part1/runs/message results/part2/runs
